# lshell configuration
# See 'man lshell' for full option details.

[global]
# --- 1) Security baseline ---
# Optional override for sudo_noexec shared library path.
# WARNING: empty string disables noexec preload and weakens confinement.
#path_noexec        : '/usr/libexec/sudo/sudo_noexec.so'

# --- 6) Observability and audit ---
# Log destination and verbosity for session events.
logpath            : /var/log/lshell/
loglevel           : 2
# Optional filename pattern (%u=username, %y%m%d=date) or syslog.
#logfilename        : %y%m%d-%u
#logfilename        : syslog
# Optional syslog app name when using syslog output.
#syslogname         : lshell

# JSON security audit events for SIEM ingestion (0=off, 1=on).
security_audit_json : 0

# --- 8) Config loading ---
# Load extra [default]/[user]/[grp:*] files from this glob.
include_dir         : /etc/lshell.d/*.conf


# Precedence: [username] > [grp:groupname] > [default].
[default]
# --- 1) Critical security baseline ---
# Executor mode: keep shellless for hardened parsing.
# WARNING: bash_compat enables shell features and raises escape risk.
runtime_executor      : shellless

# Strict mode: 1 counts unknown syntax as violations, 0 only reports.
strict                : 0
# Violations before session termination (-1 disables this control).
warning_counter       : 2

# --- 2) Core command authorization policy ---
# Command allow-list. Prefer explicit commands over 'all'.
allowed               : ['ls','echo','ll','vim','tail','sleep','touch','mkdir','cat','export', 'pwd']
#allowed               : ['echo test']  # Example: allow one exact command

# Deny-list for dangerous control tokens.
forbidden             : [';','&', '|','`','>','<', '$(','${']

# Commands from allow-list that may run through sudo.
sudo_commands         : ['ls', 'more']

# Commands allowed to spawn subcommands (never add shell-capable tools).
#allowed_shell_escape  : ['man','zcat']

# Optional allow-list for argument file extensions.
#allowed_file_extensions : ['.tmp', '.log']

# --- 3) SSH / SCP / SFTP controls ---
# Commands allowed via non-interactive SSH (for example rsync).
#overssh              : ['ls', 'rsync']

# Transfer feature gates (1=allow, 0=deny).
#scp                  : 1
#scp_upload           : 0
#scp_download         : 0
#sftp                 : 1

# Force inbound scp files into one directory.
#scpforce             : '/home/bla/uploads/'

# WinSCP compatibility for scp mode only (not sftp).
# WARNING: enabling overrides scp_upload/scp_download/scpforce and relaxes policy.
#winscp               : 0

# --- 4) Path and environment controls ---
# Restrict accessible paths for command arguments.
# WARNING: some editors/pagers can bypass this control.
#path                 : ['/etc','/var/log','/var/lib']

# Optional session HOME override (prefer account-level home management).
#home_path            : '/home/bla/'

# Optional PATH override and extra executable search roots.
#env_path             : '/usr/local/bin:/usr/sbin'
#allowed_cmd_path     : ['/home/bla/bin','/home/bla/stuff/libexec']

# Inject environment values directly or from export-style files.
#env_vars             : {'foo':1, 'bar':'helloworld'}
#env_vars_files       : ['$HOME/.lshell.env']

# Session umask in octal (for example 0002 shared-write, 0077 private).
#umask                : 0002

# --- 5) Runtime containment and session safety ---
# Set each limit to 0 to disable it.
max_sessions_per_user : 0
max_background_jobs   : 0
max_processes         : 0
command_timeout       : 0

# Optional session timer and history limits.
#timer                : 5
#history_size         : 100
#history_file         : "/home/%u/.lshell_history"

# --- 6) Observability and audit ---
# Logging and JSON audit options are configured in [global].

# --- 7) UX and customization ---
# Optional login banner shown at session start.
#intro                : "== My personal intro ==\nWelcome to lshell\nType '?' or 'help' to get the list of allowed commands"

# Prompt format tokens: %u=username, %h=hostname.
#prompt               : "%u@%h"
prompt                : "\033[91m%u\033[97m@\033[96m%h\033[0m"

# Prompt path style: 0=home-relative, 1=basename, 2=absolute.
#prompt_short         : 0

# Operator-defined command aliases.
aliases               : {'ll':'ls -l'}

# Optional message overrides (keys include unknown_syntax, forbidden_*, warning_remaining, session_terminated).
#messages             : {
#                      'unknown_syntax': 'lshell: unknown syntax: {command}',
#                      'forbidden_command': 'lshell: forbidden command: "{command}"'
#                      }

# --- 8) Legacy / advanced options ---
# Run a script at login (executes in a child shell).
#login_script         : "/path/to/myscript.sh"

# Prevent user-initiated exit from lshell.
#disable_exit         : 0
